# Reusable workflow: run mutator mutation testing on an R package.
#
# Call it from your own repo with a small caller workflow, e.g.:
#
#   jobs:
#     mutation:
#       permissions:
#         contents: write        # only needed when deploy-badge: true
#       uses: PRL-PRG/mutator/.github/workflows/mutation-testing.yaml@v0.3.0
#       with:
#         target-margin: "0.10"
#
# See the "Continuous integration" section of the mutator README for details.
name: mutation-testing

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner to execute on.
        type: string
        default: ubuntu-latest
      r-version:
        description: R version passed to r-lib/actions/setup-r.
        type: string
        default: release
      mutator-source:
        description: >-
          Where mutator is installed from: "cran" (default), "r-universe",
          "github", or "local" (mutator is the package under test, so the
          checkout itself provides it). Ignored when mutator-spec is set.
        type: string
        default: cran
      mutator-ref:
        description: >-
          Git ref used for the "github" source and for the fallback. Defaults to
          the release this workflow is versioned with; keep it a tag so the
          fallback stays reproducible.
        type: string
        default: v0.3.0
      mutator-fallback:
        description: >-
          Fall back to github::PRL-PRG/mutator@<mutator-ref> when mutator cannot
          be installed from CRAN or r-universe. No effect when mutator-spec is
          set, or when mutator-source is "github" or "local".
        type: boolean
        default: true
      r-universe-repo:
        description: r-universe repository consulted when mutator-source is "r-universe".
        type: string
        default: https://prl-prg.r-universe.dev
      mutator-spec:
        description: >-
          Explicit pak spec used to install mutator (e.g. "local::." or
          "github::PRL-PRG/mutator@main"). Overrides mutator-source, and no
          fallback is attempted. Empty by default.
        type: string
        default: ""
      install-imputesrcref:
        description: Install the optional imputesrcref package to refine mutant locations.
        type: boolean
        default: true
      imputesrcref-spec:
        description: pak spec used to install imputesrcref.
        type: string
        default: github::PRL-PRG/imputesrcref
      extra-packages:
        description: Additional pak specs to install (comma separated).
        type: string
        default: ""
      target-margin:
        description: Desired +/- half-width of the mutation-score CI as a proportion (e.g. "0.10"). Empty tests every mutant.
        type: string
        default: "0.10"
      max-mutants:
        description: Cap on the number of sampled mutants. Takes precedence over target-margin. Empty for no cap.
        type: string
        default: ""
      cores:
        description: Parallel workers. "0" auto-detects.
        type: string
        default: "0"
      timeout-seconds:
        description: Per-mutant timeout in seconds. Empty derives it from the baseline runtime.
        type: string
        default: ""
      isolate:
        description: Deep-copy src/ and tests/ into each mutant (use for non-hermetic test suites).
        type: boolean
        default: true
      coverage-guided:
        description: Run only the tests that cover each mutated line. Automatically disabled (with a warning) for installed-tests packages.
        type: boolean
        default: true
      coverage-backend:
        description: How coverage-guided attributes coverage to tests, "record_tests" (default) or "per_file" (exact file-level attribution, no helper fallback).
        type: string
        default: record_tests
      exclude-files:
        description: Glob patterns (comma/space separated) of R/ files to skip.
        type: string
        default: ""
      operators:
        description: Mutation operators (comma/space separated ids or families, "-" removes one), as in mutate_package(operators =). Empty uses the default set.
        type: string
        default: ""
      fail-under:
        description: Fail the job if the mutation score (percent) is below this number. Empty never fails.
        type: string
        default: ""
      show-confidence-interval:
        description: Show the confidence interval alongside the mutation score when mutants are sampled.
        type: boolean
        default: true
      badge-label:
        description: Label shown on the shields.io badge.
        type: string
        default: mutator
      deploy-badge:
        description: Publish the badge JSON to a branch via GitHub Pages (requires contents:write on the caller job).
        type: boolean
        default: false
      badge-branch:
        description: Branch the badge JSON is deployed to when deploy-badge is true.
        type: string
        default: gh-pages
      artifact-name:
        description: Name of the uploaded results artifact.
        type: string
        default: mutation-results
      submodules:
        description: "Checkout submodules ('false', 'true', or 'recursive'). Set for packages that vendor sources as git submodules."
        type: string
        default: "false"

jobs:
  mutation-testing:
    runs-on: ${{ inputs.runs-on }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          use-public-rspm: true

      # mutator itself is installed by the dedicated step below, not here, so a
      # failure to install it from CRAN/r-universe can be caught and retried
      # against GitHub instead of failing the whole dependency step.
      - name: Assemble package list
        id: pkgs
        shell: bash
        run: |
          pkgs="any::pkgbuild"
          if [ "${{ inputs.install-imputesrcref }}" = "true" ]; then
            pkgs="$pkgs, ${{ inputs.imputesrcref-spec }}"
          fi
          if [ -n "${{ inputs.extra-packages }}" ]; then
            pkgs="$pkgs, ${{ inputs.extra-packages }}"
          fi
          pkgs="$pkgs, local::."
          echo "list=$pkgs" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ steps.pkgs.outputs.list }}
          needs: check
          dependencies: 'c("Depends", "Imports", "LinkingTo", "Suggests")'
          install-pandoc: false

      # Install mutator from the requested source, falling back to a pinned
      # GitHub tag when the repository copy is missing or fails to build. The
      # step is skipped when mutator is the package under test, since the
      # `local::.` entry above has already installed it.
      - name: Install mutator
        if: ${{ inputs.mutator-spec != '' || inputs.mutator-source != 'local' }}
        shell: Rscript {0}
        env:
          MUTATOR_SOURCE: ${{ inputs.mutator-source }}
          MUTATOR_SPEC: ${{ inputs.mutator-spec }}
          MUTATOR_REF: ${{ inputs.mutator-ref }}
          MUTATOR_FALLBACK: ${{ inputs.mutator-fallback }}
          MUTATOR_RUNIVERSE_REPO: ${{ inputs.r-universe-repo }}
        run: |
          src <- Sys.getenv("MUTATOR_SOURCE")
          spec <- Sys.getenv("MUTATOR_SPEC")
          ref <- Sys.getenv("MUTATOR_REF")
          github_spec <- if (nzchar(ref)) {
            paste0("github::PRL-PRG/mutator@", ref)
          } else {
            "github::PRL-PRG/mutator"
          }

          fallback <- NULL
          if (nzchar(spec)) {
            primary <- spec
          } else {
            primary <- switch(src,
              cran = "any::mutator",
              "r-universe" = "any::mutator",
              github = github_spec,
              local = stop("the local source installs nothing; this step must be skipped"),
              stop(sprintf(
                "mutator-source must be 'cran', 'r-universe', 'github' or 'local', got '%s'",
                src
              ), call. = FALSE)
            )
            if (identical(src, "r-universe")) {
              repo <- Sys.getenv("MUTATOR_RUNIVERSE_REPO")
              if (!nzchar(repo)) stop("r-universe-repo must not be empty", call. = FALSE)
              options(repos = c(runiverse = repo, getOption("repos")))
            }
            if (!identical(src, "github") &&
                identical(tolower(Sys.getenv("MUTATOR_FALLBACK")), "true")) {
              fallback <- github_spec
            }
          }

          # setup-r-dependencies keeps pak in its own library, so load it from
          # there rather than adding it to .libPaths() (which would divert the
          # install away from the cached user library).
          pak_lib <- Sys.getenv("R_LIB_FOR_PAK")
          have_pak <- nzchar(pak_lib) &&
            requireNamespace("pak", lib.loc = pak_lib, quietly = TRUE)
          if (!have_pak && !requireNamespace("pak", quietly = TRUE)) {
            install.packages("pak", repos = sprintf(
              "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
              .Platform$pkgType, R.version$os, R.version$arch
            ))
          }

          install <- function(spec) {
            tryCatch({
              pak::pkg_install(spec, ask = FALSE)
              requireNamespace("mutator", quietly = TRUE)
            }, error = function(e) {
              message(sprintf("Installing '%s' failed: %s", spec, conditionMessage(e)))
              FALSE
            })
          }

          cat(sprintf("Installing mutator from '%s'\n", primary))
          if (!install(primary) && !is.null(fallback)) {
            cat(sprintf(
              "::warning::mutator could not be installed from '%s'; falling back to '%s'\n",
              primary, fallback
            ))
            install(fallback)
          }

          if (!requireNamespace("mutator", quietly = TRUE)) {
            stop("mutator could not be installed", call. = FALSE)
          }
          cat(sprintf("Using mutator %s\n", as.character(utils::packageVersion("mutator"))))

      - name: Run mutation testing
        shell: Rscript {0}
        env:
          MUTATOR_PKG_DIR: "."
          MUTATOR_OUT_DIR: mutation-results
          MUTATOR_TARGET_MARGIN: ${{ inputs.target-margin }}
          MUTATOR_MAX_MUTANTS: ${{ inputs.max-mutants }}
          MUTATOR_CORES: ${{ inputs.cores }}
          MUTATOR_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
          MUTATOR_ISOLATE: ${{ inputs.isolate }}
          MUTATOR_COVERAGE_GUIDED: ${{ inputs.coverage-guided }}
          MUTATOR_COVERAGE_BACKEND: ${{ inputs.coverage-backend }}
          MUTATOR_EXCLUDE_FILES: ${{ inputs.exclude-files }}
          MUTATOR_OPERATORS: ${{ inputs.operators }}
          MUTATOR_FAIL_UNDER: ${{ inputs.fail-under }}
          MUTATOR_SHOW_CONFIDENCE_INTERVAL: ${{ inputs.show-confidence-interval }}
          MUTATOR_BADGE_LABEL: ${{ inputs.badge-label }}
        run: source(system.file("ci", "mutation-score.R", package = "mutator"))

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: mutation-results

      - name: Deploy badge
        if: ${{ always() && inputs.deploy-badge && github.event_name != 'pull_request' }}
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: ${{ inputs.badge-branch }}
          folder: mutation-results
